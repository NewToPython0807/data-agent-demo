<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能问数 Data Agent</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand" id="brand">智能问数</div>
        <nav class="nav">
          <button class="nav-item" data-view="tables">数据表</button>
          <button class="nav-item" data-view="metrics">指标</button>
          <button class="nav-item" data-view="history">历史</button>
          <button class="nav-item" data-view="settings">设置</button>
        </nav>
        <button id="logout" class="logout">退出登录</button>
      </aside>

      <main class="conversation" id="view-ask">
        <div class="conversation-header">对话问数（点击左上角「智能问数」返回）</div>
        <div class="scroll" id="conversation-scroll">
          <div id="conversation-items"></div>
          <div id="sql-area" class="sql-area" hidden>
            <div class="label">生成的 SQL（可修改，确认后才执行）</div>
            <textarea id="sql-editor"></textarea>
            <div class="actions">
              <button id="execute">确认执行</button>
              <button id="cancel">取消</button>
            </div>
          </div>
          <div id="error" class="error"></div>
        </div>
        <div class="composer">
          <textarea id="question" placeholder="用中文描述你想查什么，例如：华东地区销售额合计是多少？"></textarea>
          <button id="ask">发送</button>
        </div>
      </main>

      <section class="result" id="result-pane">
        <div class="result-header">查询结果</div>
        <div id="result-placeholder" class="result-placeholder">执行查询后，结果会显示在这里</div>
        <div id="result-meta" class="result-meta"></div>
        <div id="result-table" class="result-table"></div>
        <div class="result-actions">
          <button id="export-btn" disabled>导出 CSV</button>
        </div>
      </section>

      <section class="view" id="view-tables" hidden>
        <h2>数据表</h2>
        <div class="panel">
          <h3>上传数据（CSV / Excel）</h3>
          <div class="row">
            <input type="file" id="upload-file" accept=".csv,.xlsx" />
            <select id="upload-mode">
              <option value="replace">整表覆盖（默认）</option>
              <option value="append">追加</option>
            </select>
            <select id="upload-table">
              <option value="">（按文件名）</option>
            </select>
            <button id="upload-btn">上传</button>
          </div>
          <div id="tables-msg" class="msg"></div>
        </div>

        <div class="panel">
          <h3>表列表与中文名</h3>
          <div id="table-list"></div>
        </div>

        <div class="panel" id="table-detail" hidden>
          <h3 id="table-detail-title">字段中文名</h3>
          <div id="column-list"></div>
        </div>
      </section>

      <section class="view" id="view-metrics" hidden>
        <h2>指标管理</h2>

        <div class="panel">
          <h3 id="metric-form-title">新增指标</h3>
          <div class="form-grid">
            <input id="m-name" placeholder="指标名称（必填）" />
            <input id="m-formula" placeholder="计算口径，如 SUM(销售额)（必填）" />
            <input id="m-table" placeholder="关联表（如 test_sales）" />
            <input id="m-column" placeholder="关联字段（如 销售额）" />
            <input id="m-unit" placeholder="单位（如 元）" />
            <input id="m-dimensions" placeholder="适用维度（如 地区/时间）" />
            <input id="m-description" class="wide" placeholder="说明" />
          </div>
          <div class="actions">
            <button id="m-save">保存</button>
            <button id="m-reset">清空</button>
          </div>
          <div id="metrics-msg" class="msg"></div>
        </div>

        <div class="panel">
          <h3>指标列表</h3>
          <div id="metric-list"></div>
        </div>

        <div class="panel" id="metric-history" hidden>
          <h3 id="metric-history-title">变更历史</h3>
          <div id="metric-history-list"></div>
        </div>
      </section>
      <section class="view" id="view-history" hidden>
        <h2>查询历史</h2>
        <div class="panel">
          <div class="row">
            <button id="history-refresh">刷新</button>
            <button id="history-clear">清空历史</button>
          </div>
          <div id="history-msg" class="msg"></div>
          <div id="history-list"></div>
        </div>
      </section>
      <section class="view" id="view-settings" hidden>
        <h2>设置</h2>
        <div class="panel">
          <h3>账号</h3>
          <div class="row">
            <span>当前账号：</span>
            <strong id="settings-username"></strong>
          </div>
          <div class="actions">
            <button id="settings-logout">退出登录</button>
          </div>
        </div>
      </section>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
